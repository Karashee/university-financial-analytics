<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Financial Analytics</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="login-layout">
    <section class="card login-card">
      <div class="login-card__brand">
        <span class="logo-mark logo-mark--lg" aria-hidden="true">FA</span>
        <div>
          <h1 class="login-card__title">Financial Analytics</h1>
          <p class="login-card__subtitle">Departmental expenditure monitoring</p>
        </div>
      </div>

      <form id="login-form" class="login-card__form" novalidate>
        <div class="field">
          <label class="label" for="username">Username</label>
          <input class="input" id="username" name="username" type="text"
                 autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>

        <div class="field">
          <label class="label" for="password">Password</label>
          <input class="input" id="password" name="password" type="password"
                 autocomplete="current-password" required>
        </div>

        <div class="login-card__actions">
          <button class="btn btn--primary btn--block" id="sign-in" type="submit">
            <span class="spinner btn__spinner" aria-hidden="true"></span>
            <span>Sign in</span>
          </button>
        </div>
      </form>

      <div class="banner banner--error login-card__banner" id="login-error" role="alert" hidden>
        <span class="banner__icon" aria-hidden="true">!</span>
        <span id="login-error-text"></span>
      </div>
    </section>

    <p class="login-footer">v1.0 &middot; Local deployment</p>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
